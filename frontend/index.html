<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Resume Analyzer</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    h1   { color: #343; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; }
    button:hover { background: #0056b3; }
    #result { margin-top: 20px; background: #f4f4f4; padding: 15px; border-radius: 8px; display: none; }
    .tag { display: inline-block; background: #28a745; color: white; padding: 4px 10px;
           border-radius: 12px; margin: 4px; font-size: 14px; }
    .job { display: inline-block; background: #007bff; color: white; padding: 4px 10px;
           border-radius: 12px; margin: 4px; font-size: 14px; }
    .error { color: red; }
  </style>
</head>
<body>

  <h1>📄 AI Resume Analyzer</h1>
  <p>Upload your resume (PDF) to get skill analysis and job recommendations.</p>

  <input type="file" id="resumeFile" accept=".pdf" />
  <br/><br/>
  <button onclick="uploadResume()">Analyze Resume</button>

  <div id="result">
    <h3>✅ Results</h3>
    <p><strong>File:</strong> <span id="filename"></span></p>

    <p><strong>Skills Found:</strong></p>
    <div id="skills"></div>

    <p><strong>Recommended Jobs:</strong></p>
    <div id="jobs"></div>
  </div>

  <p id="error" class="error"></p>

  <script>
    async function uploadResume() {
      const fileInput = document.getElementById("resumeFile");
      const errorEl   = document.getElementById("error");
      const resultEl  = document.getElementById("result");

      errorEl.textContent = "";
      resultEl.style.display = "none";

      if (!fileInput.files.length) {
        errorEl.textContent = "Please select a PDF file first.";
        return;
      }

      const formData = new FormData();
      formData.append("resume", fileInput.files[0]);

      try {
        const response = await fetch("http://127.0.0.1:5000/upload", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          errorEl.textContent = "Error: " + (data.error || "Unknown error");
          return;
        }

        document.getElementById("filename").textContent = data.filename;

        // Render skills
        const skillsDiv = document.getElementById("skills");
        skillsDiv.innerHTML = data.skills_found.length
          ? data.skills_found.map(s => `<span class="tag">${s}</span>`).join("")
          : "<em>No skills detected</em>";

        // Render jobs
        const jobsDiv = document.getElementById("jobs");
        jobsDiv.innerHTML = data.recommended_jobs.length
          ? data.recommended_jobs.map(j => `<span class="job">${j}</span>`).join("")
          : "<em>No job recommendations</em>";

        resultEl.style.display = "block";

      } catch (err) {
        errorEl.textContent = "Could not connect to server. Make sure Flask is running.";
      }
    }
  </script>

</body>
</html>
