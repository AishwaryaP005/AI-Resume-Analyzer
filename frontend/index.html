<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Resume Analyzer</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 14px;
    }

    input {
      margin-top: 15px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    button:hover {
      background: #5a67d8;
    }

    #loading {
      display: none;
      margin-top: 10px;
      color: #555;
    }

    #result {
      margin-top: 20px;
      display: none;
      text-align: left;
    }

    .tag, .job {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      margin: 5px 5px 0 0;
      font-size: 13px;
      color: white;
    }

    .tag { background: #28a745; }
    .job { background: #007bff; }

    .error {
      color: red;
      margin-top: 10px;
    }

    .filename {
      font-weight: bold;
      color: #333;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>📄 Resume Analyzer</h1>
    <p>Upload your resume to get AI-powered insights</p>

    <input type="file" id="resumeFile" accept=".pdf" />
    
    <button id="analyzeBtn" onclick="uploadResume()">Analyze Resume</button>

    <div id="loading">⏳ Analyzing...</div>

    <div id="result">
      <p>📁 <span class="filename" id="filename"></span></p>

      <p><strong>Skills:</strong></p>
      <div id="skills"></div>

      <p><strong>Recommended Jobs:</strong></p>
      <div id="jobs"></div>
    </div>

    <p id="error" class="error"></p>

  </div>

  <script>
    async function uploadResume() {
      const fileInput = document.getElementById("resumeFile");
      const errorEl   = document.getElementById("error");
      const resultEl  = document.getElementById("result");
      const loadingEl = document.getElementById("loading");

      errorEl.textContent = "";
      resultEl.style.display = "none";

      if (!fileInput.files.length) {
        errorEl.textContent = "Please select a PDF file.";
        return;
      }

      const formData = new FormData();
      formData.append("resume", fileInput.files[0]);

      loadingEl.style.display = "block";

      try {
        const response = await fetch("http://127.0.0.1:5000/upload", {
          method: "POST",
          body: formData
        });

        const data = await response.json();
        loadingEl.style.display = "none";

        if (!response.ok) {
          errorEl.textContent = data.error || "Something went wrong";
          return;
        }

        document.getElementById("filename").textContent = data.filename;

        document.getElementById("skills").innerHTML =
          data.skills_found.length
            ? data.skills_found.map(s => `<span class="tag">${s}</span>`).join("")
            : "<em>No skills found</em>";

        document.getElementById("jobs").innerHTML =
          data.recommended_jobs.length
            ? data.recommended_jobs.map(j => `<span class="job">${j}</span>`).join("")
            : "<em>No jobs found</em>";

        resultEl.style.display = "block";

      } catch (err) {
        loadingEl.style.display = "none";
        errorEl.textContent = "Server error. Make sure backend is running.";
      }
    }
  </script>

</body>
</html>
